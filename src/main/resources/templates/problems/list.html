<!doctype html>
<html lang="en">
  <head th:replace="~{fragments/head :: head}"> </head>

  <body>
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="container">
      <h1>Problems</h1>

      <a th:href="@{/web/problems/import}" class="btn btn-primary mb-4">
        Import Problems
      </a>

      <form th:action="@{/web/problems}" method="get" class="mb-4">
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Filters</h5>

            <div class="mb-3">
              <label for="problem-filter" class="form-label">Problem</label>
              <input
                id="problem-filter"
                type="search"
                class="form-control"
                placeholder="Filter problems..."
                autocomplete="off"
              />
            </div>

            <div class="d-flex flex-wrap gap-4 mb-3">
              <div class="mb-3">
                <label class="form-label">Difficulty</label>

                <div class="d-flex flex-wrap gap-2">
                  <!-- All difficulties -->
                  <input
                    type="radio"
                    class="btn-check"
                    name="difficulty"
                    id="difficulty-all"
                    value=""
                    autocomplete="off"
                    th:checked="${selectedDifficulty == null}"
                    onchange="this.form.submit()"
                  />
                  <label class="btn btn-outline-secondary" for="difficulty-all">
                    All
                  </label>

                  <!-- Individual difficulties -->
                  <div th:each="difficulty : ${difficulties}">
                    <input
                      type="radio"
                      class="btn-check"
                      name="difficulty"
                      th:id="${'difficulty-' + difficulty.name()}"
                      th:value="${difficulty.name()}"
                      autocomplete="off"
                      th:checked="${selectedDifficulty == difficulty}"
                      onchange="this.form.submit()"
                    />
                    <label
                      class="btn"
                      th:classappend="${difficulty.badgeClass.replace('text-bg-', 'btn-outline-')}"
                      th:for="${'difficulty-' + difficulty.name()}"
                      th:text="${difficulty.displayName}"
                    >
                      Medium
                    </label>
                  </div>
                </div>
              </div>

              <!-- Status -->
              <div class="mb-3">
                <label class="form-label">Status</label>

                <div class="d-flex flex-wrap gap-2">
                  <input
                    type="radio"
                    class="btn-check"
                    name="status"
                    id="status-all"
                    value="ALL"
                    th:checked="${selectedStatus == T(com.example.leetcodetracker.problem.ProblemStatus).ALL}"
                    onchange="this.form.submit()"
                  />
                  <label class="btn btn-outline-secondary" for="status-all">
                    All
                  </label>

                  <input
                    type="radio"
                    class="btn-check"
                    name="status"
                    id="status-solved"
                    value="SOLVED"
                    th:checked="${selectedStatus == T(com.example.leetcodetracker.problem.ProblemStatus).SOLVED}"
                    onchange="this.form.submit()"
                  />
                  <label class="btn btn-outline-secondary" for="status-solved">
                    Solved
                  </label>

                  <input
                    type="radio"
                    class="btn-check"
                    name="status"
                    id="status-unsolved"
                    value="UNSOLVED"
                    th:checked="${selectedStatus == T(com.example.leetcodetracker.problem.ProblemStatus).UNSOLVED}"
                    onchange="this.form.submit()"
                  />
                  <label
                    class="btn btn-outline-secondary"
                    for="status-unsolved"
                  >
                    Unsolved
                  </label>
                </div>
              </div>
            </div>

            <!-- Tags -->
            <div class="mb-3">
              <label class="form-label">Tags</label>

              <input
                id="tag-filter"
                type="search"
                class="form-control mb-2"
                placeholder="Filter tags..."
                autocomplete="off"
              />

              <div id="tag-list" class="d-flex flex-wrap gap-2">
                <div th:each="tag : ${tags}" class="tag-option">
                  <input
                    type="checkbox"
                    class="btn-check"
                    name="tags"
                    th:id="${'tag-' + tag.slug}"
                    th:value="${tag.slug}"
                    autocomplete="off"
                    th:checked="${selectedTags.contains(tag.slug)}"
                    onchange="this.form.submit()"
                  />

                  <label
                    class="btn btn-outline-secondary btn-sm"
                    th:for="${'tag-' + tag.slug}"
                    th:text="${tag.name}"
                  >
                    Array
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th scope="col">Solved</th>
              <th scope="col">ID</th>
              <th scope="col">Title</th>
              <th scope="col">Difficulty</th>
              <th scope="col">Tags</th>
            </tr>
          </thead>

          <tbody>
            <tr
              th:each="problem : ${problems}"
              th:attr="data-problem-title=${problem.title}"
            >
              <td>
                <span
                  th:if="${solvedProblemIds.contains(problem.id)}"
                  class="badge text-bg-success"
                >
                  Solved
                </span>

                <span
                  th:unless="${solvedProblemIds.contains(problem.id)}"
                  class="badge text-bg-secondary"
                >
                  Unsolved
                </span>

                <span
                  th:if="${latestSolvedDates.containsKey(problem.id)}"
                  th:text="${#temporals.format(latestSolvedDates[problem.id], 'yyyy-MM-dd')}"
                >
                  2026-09-24
                </span>

                <span
                  th:unless="${latestSolvedDates.containsKey(problem.id)}"
                  class="text-body-secondary"
                ></span>
              </td>
              <td th:text="${problem.id}"></td>
              <td>
                <a
                  th:href="@{/web/problems/{id}(id=${problem.id})}"
                  th:text="${problem.title}"
                >
                </a>
              </td>
              <td>
                <a
                  th:text="${problem.difficulty.displayName}"
                  class="badge rounded-pill text-decoration-none"
                  th:classappend="${problem.difficulty.badgeClass}"
                  th:href="@{/web/problems(difficulty=${problem.difficulty},tags=${selectedTags})}"
                  >Medium</a
                >
                <!-- need to add to current filters not replace -->
              </td>
              <td>
                <span th:each="tag, iter : ${problem.tags}">
                  <a
                    th:href="@{/web/problems(difficulty=${selectedDifficulty},tags=${tagsWithAddition[tag.slug]})}"
                    th:text="${tag.name}"
                    class="badge rounded-pill text-bg-secondary me-1 text-decoration-none"
                    >Array</a
                  ><span th:if="${!iter.last}"> </span>
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
  </body>
</html>
