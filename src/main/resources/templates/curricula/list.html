<!doctype html>
<html lang="en">
  <head th:replace="~{fragments/head :: head}"> </head>
  <body>
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="container">
      <h1>Curricula</h1>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Modules</th>
              <th scope="col">Module Problems</th>
              <th scope="col">Module Progress</th>
              <th scope="col">Module Revisit</th>
              <th scope="col">Direct Problems</th>
              <th scope="col">Direct Progress</th>
              <th scope="col">Direct Revisit</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="curriculum : ${curricula}">
              <td>
                <a
                  th:href="@{/web/curricula/{id}(id=${curriculum.id})}"
                  th:text="${curriculum.name}"
                >
                  Curriculum
                </a>
              </td>

              <td th:text="${curriculumStatuses[curriculum.id].modules}">8</td>

              <td th:text="${curriculumStatuses[curriculum.id].moduleProblems}">
                60
              </td>

              <td>
                <span
                  th:text="${curriculumStatuses[curriculum.id].completedModuleProblems}"
                >
                  42
                </span>
                /
                <span
                  th:text="${curriculumStatuses[curriculum.id].moduleProblems}"
                >
                  60
                </span>
              </td>

              <td
                th:text="${curriculumStatuses[curriculum.id].moduleProblemsToRevisit}"
              >
                5
              </td>

              <td
                th:text="${curriculumStatuses[curriculum.id].curriculumProblems}"
              >
                3
              </td>

              <td>
                <span
                  th:text="${curriculumStatuses[curriculum.id].completedCurriculumProblems}"
                >
                  2
                </span>
                /
                <span
                  th:text="${curriculumStatuses[curriculum.id].curriculumProblems}"
                >
                  3
                </span>
              </td>

              <td
                th:text="${curriculumStatuses[curriculum.id].curriculumProblemsToRevisit}"
              >
                1
              </td>

              <td>
                <form
                  th:action="@{/web/curricula/{id}/delete(id=${curriculum.id})}"
                  method="post"
                >
                  <button type="submit" class="btn btn-danger">Delete</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <h2>Create Curriculum</h2>

      <form th:action="@{/web/curricula}" method="post" class="col-md-6">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Create</button>
      </form>
    </main>
  </body>
</html>
