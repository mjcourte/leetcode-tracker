<!doctype html>
<html lang="en">
  <head th:replace="~{fragments/head :: head}"> </head>
  <body>
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="container">
      <h1>Curricula</h1>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="curriculum : ${curricula}">
              <td>
                <a
                  th:href="@{/web/curricula/{id}(id=${curriculum.id})}"
                  th:text="${curriculum.name}"
                >
                  Curriculum
                </a>
              </td>
              <td>
                <form
                  th:action="@{/web/curricula/{id}/delete(id=${curriculum.id})}"
                  method="post"
                >
                  <button type="submit">Delete</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <h2>Create Curriculum</h2>

      <form th:action="@{/web/curricula}" method="post" class="col-md-6">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Create</button>
      </form>
    </main>
  </body>
</html>
