spring:
  application:
    name: leetcodetracker
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false
  devtools:
    livereload:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG